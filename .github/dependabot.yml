# Mỗi tuần mở PR cập nhật thư viện, gom theo nhóm cho đỡ nhiều PR lẻ.
# PR của Dependabot cũng phải qua CI như mọi PR khác.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: [ "*" ]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(client)
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(api)
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
